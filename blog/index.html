<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>블로그/기술문서 — 413.log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet" />
  <link rel="icon" href="../assets/logo.png" />
  <link rel="stylesheet" href="../assets/style.css" />
</head>
<body>
  <script src="../assets/menu.js" data-root="../"></script>

  <main class="page-wrap">
    <p class="eyebrow display">BLOG / DOCS</p>
    <h1>블로그/기술문서</h1>
    <p class="lead">기술 블로그 글과 정리한 문서</p>

    <nav class="tabs">
      <a href="#blog">블로그</a>
      <a href="#docs">기술문서</a>
    </nav>

    <!-- ===== 블로그 목록 ===== -->
    <section class="list-block" id="blog">
      <div class="list-head">
        <h2>블로그</h2>
        <span>1편</span>
      </div>

      <!--
        새 글 추가 방법
        1) reflection 폴더를 통째로 복사해서 폴더 이름을 바꾸고, 안의 index.html 내용을 채웁니다.
        2) 아래 <li> ... </li> 덩어리 하나를 복사해 맨 위에 붙이고,
           href(폴더이름/), 연도, 제목, 설명, 태그를 바꿉니다.
        3) 위의 "1편" 숫자도 바꿔 주세요.
        * 기술문서는 아래 "기술문서 목록"에 같은 방식으로 넣으면 됩니다.
      -->
      <ul class="paper-list">
        <li>
          <a href="reflection/">
            <span class="year">2026</span>
            <div>
              <h3>회고록</h3>
              <p class="venue">Reflection · 돌아보기와 앞으로의 다짐</p>
              <p class="summary">지금까지의 보안 활동을 돌아보고, Knights Frontier 3기를 시작하며 세운 보완 방향과 다짐</p>
              <span class="tag">회고</span>
            </div>
            <span class="arrow">→</span>
          </a>
        </li>
      </ul>
    </section>

    <!-- ===== 기술문서 목록 (나중에 채우기) ===== -->
    <section class="list-block" id="docs">
      <div class="list-head">
        <h2>기술문서</h2>
        <span>0건</span>
      </div>
      <ul class="post-list">
        <li class="empty">아직 작성된 기술문서가 없습니다.</li>
      </ul>
    </section>
  </main>

  <footer class="footer">© 413.log</footer>

</html>
